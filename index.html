<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Screen Share & Control | লাইভ রিমোট স্ক্রিন</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-trans(135deg, #10b981, #059669);
      background: #10b981;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #f8fafc;
    }
    .brand p {
      font-size: 11px;
      color: #94a3b8;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid #10b981;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: #10b981; color: #022c22; font-weight: 700; }
    .btn-primary:hover { background: #34d399; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .btn-danger:hover { background: #ef4444; color: white; }
    .btn-action {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      font-weight: 600;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      padding: 6px 12px;
      transition: all 0.2s;
    }
    .btn-action:hover { background: #334155; color: #34d399; border-color: #10b981; }

    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .input-text {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-text:focus { border-color: #10b981; }

    /* Screen Stage */
    .screen-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }
    .screen-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .viewport {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 74vh;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 0 2px #1e293b;
      position: relative;
      cursor: crosshair;
      user-select: none;
      touch-action: none;
    }
    .viewport video, .viewport img, .viewport canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .touch-ripple {
      position: absolute;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.6);
      box-shadow: 0 0 12px #10b981;
      pointer-events: none;
      animation: ripple 0.4s ease-out forwards;
    }
    @keyframes ripple {
      0% { transform: scale(0.4); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .nav-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }
    .btn-nav {
      flex: 1;
      padding: 12px 6px;
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
      font-weight: 700;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-nav:hover { background: #1e293b; color: #34d399; border-color: #10b981; }
    .btn-nav:active { transform: scale(0.97); }

    .typing-bar {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-top: 10px;
      background: #0f172a;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }
    .typing-input {
      flex: 1;
      background: #020617;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .typing-input:focus { border-color: #10b981; }

    /* Fullscreen mode */
    body.is-fullscreen header { display: none !important; }
    body.is-fullscreen main { padding: 0 !important; }
    body.is-fullscreen .screen-stage { max-width: 100vw; height: 100vh; }
    body.is-fullscreen .viewport { max-height: 85vh; border-radius: 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <h1>Live Screen Share & Control</h1>
        <p id="hdr-phone-user">সরাসরি লাইভ রিমোট স্ক্রিন ও রিয়েল-টাইম কন্ট্রোল</p>
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <span id="session-badge" class="badge" style="display:none;"><span class="pulse-dot"></span> LIVE SHARING</span>
      <button id="logout-btn" class="btn btn-danger" style="display:none;" onclick="logout()">Disconnect</button>
    </div>
  </header>

  <main>
    <!-- LOGIN VIEW (ONLY USERNAME & PASSWORD) -->
    <div id="login-card" class="card" style="max-width:440px; width:100%; margin: 20px auto;">
      <h2 style="font-size: 18px; margin-bottom: 8px; color: #10b981; display:flex; align-items:center; gap:8px;">
        <span>📱</span> কানেক্ট করুন (Live Screen Share)
      </h2>
      <p style="font-size: 13px; color: #94a3b8; margin-bottom: 18px; line-height: 18px;">
        যেকোনো কম্পিউটার বা ব্রাউজার থেকে সরাসরি আপনার মোবাইলের লাইভ স্ক্রিন দেখুন এবং মাউস দিয়ে কন্ট্রোল করুন:
      </p>

      <!-- Auto-Discovered Devices Box -->
      <div id="auto-devices-box" style="margin-bottom: 16px; display: none;">
        <label style="font-size: 12px; color: #34d399; font-weight: 700; display:flex; align-items:center; gap:6px; margin-bottom: 8px;">
          <span class="pulse-dot"></span> সক্রিয় মোবাইল ডিভাইস (Online Devices Found):
        </label>
        <div id="auto-devices-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <label style="font-size: 12px; color: #a7f3d0; font-weight: 600; display:block; margin-bottom:4px;">Mobile User ID (Username):</label>
      <input type="text" id="username-input" class="input-text" placeholder="e.g. myphone-xxxxxx">

      <label style="font-size: 12px; color: #a7f3d0; font-weight: 600; display:block; margin-bottom:4px;">Master Password (ডিফল্ট: HostAdmin@2026):</label>
      <input type="password" id="password-input" class="input-text" placeholder="Enter mobile password" value="HostAdmin@2026">

      <div id="auth-err" style="display:none; color:#f87171; font-size:12px; margin-bottom:12px; background: rgba(239,68,68,0.1); padding: 8px; border-radius: 6px;"></div>

      <button class="btn btn-primary" style="width:100%; padding:12px; font-size:14px; justify-content:center;" onclick="connectWithCloud()">
        Start Live Screen Share ➔
      </button>
    </div>

    <!-- MAIN LIVE SCREEN SHARE & INTERACTIVE TOUCH STAGE -->
    <div id="screen-stage" class="screen-stage" style="display:none;">
      <!-- Stream Status Header Bar -->
      <div class="screen-header-bar">
        <div style="display:flex; align-items:center; gap:6px;">
          <span id="webrtc-badge" class="badge" style="background:rgba(16,185,129,0.2); color:#34d399; font-size:11px; border:1px solid #10b981;">
            ⚡ WebRTC P2P
          </span>
          <span id="webrtc-ping" style="font-size:11px; color:#94a3b8; font-weight:700;">-- ms</span>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button class="btn-action" onclick="requestImmediateKeyframe()" title="Force I-Frame Keyframe Sync">
            ⚡ Sync
          </button>
          <button class="btn-action" onclick="toggleFullscreen()" title="Toggle Fullscreen">
            ⛶ Expand
          </button>
        </div>
      </div>

      <!-- Phone Viewport (Where live video is rendered & clicks are registered) -->
      <div class="viewport" id="viewport">
        <video id="mobile-screen-video" autoplay playsinline muted style="display:none; width:100%; height:100%; object-fit:contain;"></video>
        <canvas id="mobile-screen-canvas" style="display:none; width:100%; height:100%; object-fit:contain;"></canvas>
        <img id="mobile-screen-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='720' viewBox='0 0 360 720'><rect width='360' height='720' fill='%23020617'/><text x='180' y='330' fill='%2310b981' font-size='22' font-family='sans-serif' font-weight='bold' text-anchor='middle'>⚡ Live Remote Screen</text><text x='180' y='370' fill='%2394a3b8' font-size='14' font-family='sans-serif' text-anchor='middle'>Connecting to Screen Stream...</text></svg>" alt="Live screen stream">
      </div>

      <!-- Android Navigation Control Bar -->
      <div class="nav-bar">
        <button class="btn-nav" onclick="sendCloudNav('BACK')">◀ BACK</button>
        <button class="btn-nav" onclick="sendCloudNav('HOME')">● HOME</button>
        <button class="btn-nav" onclick="sendCloudNav('RECENTS')">■ RECENTS</button>
        <button class="btn-nav" onclick="wakeDeviceScreen()" style="color:#38bdf8;" title="Turn screen on">💡 WAKE</button>
      </div>

      <!-- Remote Typing Input Bar -->
      <div class="typing-bar">
        <input type="text" id="type-text-input" class="typing-input" placeholder="Type text to send to phone screen..." onkeypress="handleTypeKey(event)">
        <button class="btn btn-primary" style="padding: 8px 14px; font-size:12px;" onclick="sendCloudText()">
          Send ➔
        </button>
      </div>
    </div>
  </main>

  <!-- FIREBASE MODULAR SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      addDoc, 
      collection, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "gen-lang-client-0052839779",
      apiKey: "AIzaSyAMRpg5YLfdkmiW3tWq_pS1A_6O6OPoCuE",
      storageBucket: "gen-lang-client-0052839779.firebasestorage.app",
      messagingSenderId: "835001523988",
      appId: "1:835001523988:android:dd7f29d948a17b5ec4ac01"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, "ai-studio-android-remoteho-62368fa1-0461-462b-9312-02bfbe8fae80");

    let currentUsername = "";
    let hostDocUnsubscribe = null;
    let lastRenderedFrameTime = 0;

    // WebRTC P2P Ultra-Fast State
    let rtcPeerConnection = null;
    let rtcDataChannel = null;
    let hostIceUnsubscribe = null;
    let hostAnswerUnsubscribe = null;
    let isWebRtcActive = false;
    let webrtcPingInterval = null;
    let currentSessionId = "";
    let pendingHostCandidates = [];

    // SDP Munging for VP8 priority and low-latency bitrate limit
    function mungeSdpForLowLatency(sdp) {
      const lines = sdp.split("\r\n");
      let vp8Payload = null;
      let h264Payload = null;

      for (const line of lines) {
        if (line.startsWith("a=rtpmap:")) {
          const parts = line.replace("a=rtpmap:", "").split(" ");
          const pt = parts[0];
          const codec = (parts[1] || "").toUpperCase();
          if (codec.startsWith("VP8")) {
            vp8Payload = pt;
          } else if (codec.startsWith("H264")) {
            h264Payload = pt;
          }
        }
      }

      const result = [];
      for (let line of lines) {
        if (line.startsWith("m=video")) {
          if (vp8Payload) {
            const tokens = line.split(" ");
            if (tokens.length > 3) {
              const header = tokens.slice(0, 3);
              const pts = tokens.slice(3).filter(p => p !== vp8Payload);
              pts.unshift(vp8Payload);
              line = header.concat(pts).join(" ");
            }
          }
          result.push(line);
          result.push("b=AS:1500");
          result.push("b=TIAS:1500000");
          continue;
        }

        if (line.startsWith("a=fmtp:")) {
          const pt = line.replace("a=fmtp:", "").split(" ")[0];
          if (pt === vp8Payload || pt === h264Payload) {
            if (!line.includes("x-google-max-bitrate")) {
              line += ";x-google-max-bitrate=1500;x-google-min-bitrate=800;x-google-start-bitrate=1000";
            }
          }
        }

        result.push(line);
      }
      return result.join("\r\n");
    }

    async function startWebRtcConnection(username) {
      if (!username) return;
      currentSessionId = "sess_" + Date.now();
      pendingHostCandidates = [];
      const badge = document.getElementById("webrtc-badge");
      if (badge) {
        badge.textContent = "⏳ WebRTC Connecting...";
        badge.style.background = "rgba(245, 158, 11, 0.2)";
        badge.style.color = "#fbbf24";
        badge.style.border = "1px solid #f59e0b";
      }

      try {
        if (rtcPeerConnection) {
          try { rtcPeerConnection.close(); } catch (_) {}
        }
        if (hostIceUnsubscribe) hostIceUnsubscribe();
        if (hostAnswerUnsubscribe) hostAnswerUnsubscribe();
        if (webrtcPingInterval) clearInterval(webrtcPingInterval);
        if (window.catchUpInterval) clearInterval(window.catchUpInterval);

        const config = {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun2.l.google.com:19302" }
          ],
          iceTransportPolicy: "all",
          bundlePolicy: "max-bundle"
        };

        rtcPeerConnection = new RTCPeerConnection(config);

        rtcPeerConnection.ontrack = (event) => {
          const video = document.getElementById("mobile-screen-video");
          const img = document.getElementById("mobile-screen-img");
          const canvas = document.getElementById("mobile-screen-canvas");
          if (video && event.streams[0]) {
            video.srcObject = event.streams[0];
            video.style.display = "block";
            if (img) img.style.display = "none";
            if (canvas) canvas.style.display = "none";
            video.play().catch(() => {});
          }
          if (event.receiver) {
            if ('playoutDelayHint' in event.receiver) event.receiver.playoutDelayHint = 0.0;
            if ('jitterBufferTarget' in event.receiver) event.receiver.jitterBufferTarget = 0.0;
          }

          // Receiver active catch-up loop
          if (window.catchUpInterval) clearInterval(window.catchUpInterval);
          window.catchUpInterval = setInterval(() => {
            if (video && video.buffered && video.buffered.length > 0) {
              const liveEnd = video.buffered.end(video.buffered.length - 1);
              const lag = liveEnd - video.currentTime;
              if (lag > 0.4) {
                video.currentTime = Math.max(0, liveEnd - 0.04);
              } else if (lag > 0.18) {
                video.playbackRate = 1.25;
              } else {
                video.playbackRate = 1.0;
              }
            }
          }, 100);
        };

        rtcPeerConnection.addTransceiver("video", { direction: "recvonly" });

        rtcDataChannel = rtcPeerConnection.createDataChannel("control", { ordered: true });
        rtcDataChannel.binaryType = "arraybuffer";

        rtcDataChannel.onopen = () => {
          isWebRtcActive = true;
          if (badge) {
            badge.textContent = "⚡ WebRTC P2P (Live)";
            badge.style.background = "rgba(16, 185, 129, 0.2)";
            badge.style.color = "#34d399";
            badge.style.border = "1px solid #10b981";
          }
          requestImmediateKeyframe();

          webrtcPingInterval = setInterval(() => {
            if (rtcDataChannel && rtcDataChannel.readyState === "open") {
              const startT = performance.now();
              rtcDataChannel.send(JSON.stringify({ type: "ping", t: startT }));
            }
          }, 2000);
        };

        rtcDataChannel.onmessage = (event) => {
          if (typeof event.data === "string") {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === "pong" && msg.t) {
                const rtt = Math.round(performance.now() - msg.t);
                const pingEl = document.getElementById("webrtc-ping");
                if (pingEl) pingEl.textContent = `${rtt} ms`;
              }
            } catch (_) {}
          } else if (event.data instanceof ArrayBuffer) {
            handleBinaryFrame(event.data);
          }
        };

        rtcPeerConnection.onicecandidate = async (event) => {
          if (event.candidate) {
            try {
              await addDoc(collection(db, "hosts", username, "offerCandidates"), {
                sessionId: currentSessionId,
                candidate: event.candidate.candidate,
                sdpMid: event.candidate.sdpMid,
                sdpMLineIndex: event.candidate.sdpMLineIndex,
                timestamp: Date.now()
              });
            } catch (err) {
              console.warn("Failed sending ICE candidate:", err);
            }
          }
        };

        const offer = await rtcPeerConnection.createOffer();
        const mungedOfferSdp = mungeSdpForLowLatency(offer.sdp);
        await rtcPeerConnection.setLocalDescription({ type: offer.type, sdp: mungedOfferSdp });

        await setDoc(doc(db, "hosts", username, "signaling", "offer"), {
          sessionId: currentSessionId,
          type: "offer",
          sdp: mungedOfferSdp,
          timestamp: Date.now()
        });

        // Listen for Answer
        hostAnswerUnsubscribe = onSnapshot(doc(db, "hosts", username, "signaling", "answer"), async (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.sdp && (!data.sessionId || data.sessionId === currentSessionId)) {
              if (rtcPeerConnection.signalingState === "have-local-offer") {
                await rtcPeerConnection.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: data.sdp }));
                while (pendingHostCandidates.length > 0) {
                  const cand = pendingHostCandidates.shift();
                  await rtcPeerConnection.addIceCandidate(cand).catch(() => {});
                }
              }
            }
          }
        });

        // Listen for ICE candidates
        hostIceUnsubscribe = onSnapshot(collection(db, "hosts", username, "answerCandidates"), (snapshot) => {
          snapshot.docChanges().forEach(async (change) => {
            if (change.type === "added") {
              const c = change.doc.data();
              if (c.candidate && (!c.sessionId || c.sessionId === currentSessionId)) {
                const candidate = new RTCIceCandidate({
                  candidate: c.candidate,
                  sdpMid: c.sdpMid,
                  sdpMLineIndex: c.sdpMLineIndex
                });
                if (rtcPeerConnection.remoteDescription) {
                  await rtcPeerConnection.addIceCandidate(candidate).catch(() => {});
                } else {
                  pendingHostCandidates.push(candidate);
                }
              }
            }
          });
        });

      } catch (err) {
        console.warn("WebRTC setup notice:", err);
      }
    }

    function handleBinaryFrame(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      if (bytes.length < 2) return;
      const packetType = bytes[0];
      const payload = bytes.subarray(1);

      if (packetType === 0x01) {
        // Raw JPEG frame
        const blob = new Blob([payload], { type: "image/jpeg" });
        const url = URL.createObjectURL(blob);
        const img = document.getElementById("mobile-screen-img");
        if (img) {
          const oldUrl = img.src;
          img.src = url;
          img.style.display = "block";
          const vid = document.getElementById("mobile-screen-video");
          if (vid) vid.style.display = "none";
          if (oldUrl && oldUrl.startsWith("blob:")) URL.revokeObjectURL(oldUrl);
        }
      }
    }

    window.requestImmediateKeyframe = function() {
      sendCloudCommand({ type: "request_keyframe" });
      if (rtcDataChannel && rtcDataChannel.readyState === "open") {
        try { rtcDataChannel.send(JSON.stringify({ type: "request_keyframe" })); } catch (_) {}
      }
    };

    async function sendCloudCommand(payload) {
      if (!currentUsername) return;

      // 1. Instant 0ms execution via WebRTC DataChannel
      if (rtcDataChannel && rtcDataChannel.readyState === "open") {
        try {
          rtcDataChannel.send(JSON.stringify(payload));
          return;
        } catch (_) {}
      }

      // 2. Fallback to Firestore command queue
      try {
        await addDoc(collection(db, "hosts", currentUsername, "commands"), {
          ...payload,
          executed: false,
          timestamp: Date.now()
        });
      } catch (e) {
        console.error("Failed to send command:", e);
      }
    }

    async function connectWithCloud() {
      const user = document.getElementById("username-input").value.trim().toLowerCase();
      const pwd = document.getElementById("password-input").value.trim();
      const errEl = document.getElementById("auth-err");
      errEl.style.display = "none";

      if (!user || !pwd) {
        errEl.textContent = "মোবাইল ইউজার আইডি এবং পাসওয়ার্ড দিন";
        errEl.style.color = "#f87171";
        errEl.style.display = "block";
        return;
      }

      try {
        errEl.style.color = "#34d399";
        errEl.style.display = "block";

        let docSnap = null;
        for (let attempt = 1; attempt <= 3; attempt++) {
          errEl.textContent = "Connecting to mobile screen... (Attempt " + attempt + " of 3)";
          const docRef = doc(db, "hosts", user);
          docSnap = await getDoc(docRef);
          if (docSnap && docSnap.exists()) break;
          if (attempt < 3) await new Promise(r => setTimeout(r, 1200));
        }

        if (!docSnap || !docSnap.exists()) {
          errEl.innerHTML = "<strong>মোবাইল আইডি '" + user + "' পাওয়া যায়নি।</strong><br><br>" +
            "• আপনার মোবাইলে <strong>Remote Host</strong> অ্যাপটি চালু করুন।<br>" +
            "• অ্যাপের উপরে প্রদর্শিত ইউজার আইডি (যেমন: " + user + ") মিলিয়ে নিন।";
          errEl.style.color = "#f87171";
          errEl.style.display = "block";
          return;
        }

        const data = docSnap.data();
        if (data.password && data.password !== pwd) {
          errEl.textContent = "ভুল পাসওয়ার্ড। মোবাইলের অ্যাপে দেওয়া পাসওয়ার্ড দিন (ডিফল্ট: HostAdmin@2026)";
          errEl.style.color = "#f87171";
          errEl.style.display = "block";
          return;
        }

        try {
          localStorage.setItem("last_connected_user", user);
          localStorage.setItem("last_connected_pwd", pwd);
        } catch (_) {}

        currentUsername = user;
        document.getElementById("login-card").style.display = "none";
        document.getElementById("screen-stage").style.display = "flex";
        document.getElementById("session-badge").style.display = "inline-flex";
        document.getElementById("logout-btn").style.display = "inline-flex";
        document.getElementById("hdr-phone-user").textContent = "Connected: " + user;

        if (data.latestFrame) {
          lastRenderedFrameTime = data.frameTimestamp || 0;
          const img = document.getElementById("mobile-screen-img");
          if (img) {
            img.src = data.latestFrame.startsWith("data:") ? data.latestFrame : ("data:image/jpeg;base64," + data.latestFrame);
            img.style.display = "block";
          }
        }

        listenToMobileScreen(user);
        startWebRtcConnection(user);
        initInteractiveScreen();
      } catch (e) {
        errEl.textContent = "Connection error: " + e.message;
        errEl.style.color = "#f87171";
        errEl.style.display = "block";
      }
    }

    function listenToMobileScreen(username) {
      if (hostDocUnsubscribe) hostDocUnsubscribe();
      hostDocUnsubscribe = onSnapshot(doc(db, "hosts", username), (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();
        
        // Live Screen Frame update fallback
        if (data.latestFrame && data.frameTimestamp !== lastRenderedFrameTime) {
          lastRenderedFrameTime = data.frameTimestamp;
          const img = document.getElementById("mobile-screen-img");
          if (img) {
            img.src = data.latestFrame.startsWith("data:") ? data.latestFrame : ("data:image/jpeg;base64," + data.latestFrame);
            img.style.display = "block";
            const vid = document.getElementById("mobile-screen-video");
            if (vid && !isWebRtcActive) vid.style.display = "none";
          }
        }
      });
    }

    // INTERACTIVE TOUCH, CLICK, SWIPE & DRAG ON SCREEN
    function initInteractiveScreen() {
      const viewport = document.getElementById("viewport");
      if (!viewport || viewport.dataset.initialized) return;
      viewport.dataset.initialized = "true";

      let startX = 0;
      let startY = 0;
      let startTime = 0;
      let isDragging = false;

      function getNormalizedCoords(e) {
        const rect = viewport.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
        return { x, y, clientX, clientY, rect };
      }

      function showRipple(clientX, clientY, rect) {
        const ripple = document.createElement("div");
        ripple.className = "touch-ripple";
        ripple.style.left = (clientX - rect.left) + "px";
        ripple.style.top = (clientY - rect.top) + "px";
        viewport.appendChild(ripple);
        setTimeout(() => ripple.remove(), 400);
      }

      // Mouse events
      viewport.addEventListener("mousedown", (e) => {
        e.preventDefault();
        isDragging = true;
        const p = getNormalizedCoords(e);
        startX = p.x;
        startY = p.y;
        startTime = Date.now();
        showRipple(p.clientX, p.clientY, p.rect);
      });

      viewport.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        const p = getNormalizedCoords(e);
        const elapsed = Date.now() - startTime;
        const dist = Math.hypot(p.x - startX, p.y - startY);

        if (dist < 0.03) {
          sendCloudCommand({ type: "tap", x: startX, y: startY });
        } else {
          sendCloudCommand({ type: "swipe", startX: startX, startY: startY, endX: p.x, endY: p.y, durationMs: Math.min(500, elapsed) });
        }
      });

      // Mouse Wheel for Scrolling
      viewport.addEventListener("wheel", (e) => {
        e.preventDefault();
        const p = getNormalizedCoords(e);
        const delta = e.deltaY;
        const scrollAmount = delta > 0 ? -0.2 : 0.2;
        const endY = Math.max(0, Math.min(1, p.y + scrollAmount));
        sendCloudCommand({
          type: "swipe",
          startX: p.x,
          startY: p.y,
          endX: p.x,
          endY: endY,
          durationMs: 200
        });
      }, { passive: false });

      // Touch events
      viewport.addEventListener("touchstart", (e) => {
        isDragging = true;
        const p = getNormalizedCoords(e);
        startX = p.x;
        startY = p.y;
        startTime = Date.now();
        showRipple(p.clientX, p.clientY, p.rect);
      }, { passive: true });

      viewport.addEventListener("touchend", (e) => {
        if (!isDragging) return;
        isDragging = false;
        const elapsed = Date.now() - startTime;
        const lastTouch = e.changedTouches ? e.changedTouches[0] : null;
        if (!lastTouch) return;
        const rect = viewport.getBoundingClientRect();
        const endX = Math.max(0, Math.min(1, (lastTouch.clientX - rect.left) / rect.width));
        const endY = Math.max(0, Math.min(1, (lastTouch.clientY - rect.top) / rect.height));
        const dist = Math.hypot(endX - startX, endY - startY);

        if (dist < 0.03) {
          sendCloudCommand({ type: "tap", x: startX, y: startY });
        } else {
          sendCloudCommand({ type: "swipe", startX: startX, startY: startY, endX: endX, endY: endY, durationMs: Math.min(500, elapsed) });
        }
      }, { passive: true });
    }

    function logout() {
      if (hostDocUnsubscribe) hostDocUnsubscribe();
      if (hostIceUnsubscribe) hostIceUnsubscribe();
      if (hostAnswerUnsubscribe) hostAnswerUnsubscribe();
      if (webrtcPingInterval) clearInterval(webrtcPingInterval);
      if (window.catchUpInterval) clearInterval(window.catchUpInterval);
      if (rtcPeerConnection) {
        try { rtcPeerConnection.close(); } catch (_) {}
        rtcPeerConnection = null;
      }
      rtcDataChannel = null;
      isWebRtcActive = false;
      currentUsername = "";
      document.getElementById("login-card").style.display = "block";
      document.getElementById("screen-stage").style.display = "none";
      document.getElementById("session-badge").style.display = "none";
      document.getElementById("logout-btn").style.display = "none";
      document.getElementById("hdr-phone-user").textContent = "সরাসরি লাইভ রিমোট স্ক্রিন ও রিয়েল-টাইম কন্ট্রোল";
    }

    window.connectWithCloud = connectWithCloud;
    window.sendCloudNav = function(action) {
      sendCloudCommand({ type: "nav", action: action });
    };
    window.wakeDeviceScreen = function() {
      sendCloudCommand({ type: "wake" });
    };
    window.sendCloudText = function() {
      const input = document.getElementById("type-text-input");
      const text = input.value.trim();
      if (!text) return;
      sendCloudCommand({ type: "text", text: text });
      input.value = "";
    };
    window.handleTypeKey = function(e) {
      if (e.key === "Enter") {
        sendCloudText();
      }
    };
    window.toggleFullscreen = function() {
      document.body.classList.toggle("is-fullscreen");
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };
    window.logout = logout;

    // Auto-discover active hosts from Firestore
    try {
      onSnapshot(collection(db, "hosts"), (snapshot) => {
        const box = document.getElementById("auto-devices-box");
        const list = document.getElementById("auto-devices-list");
        if (!box || !list) return;

        if (snapshot.empty) {
          box.style.display = "none";
          return;
        }

        list.innerHTML = "";
        let count = 0;

        snapshot.forEach((docSnap) => {
          const d = docSnap.data();
          const hostId = docSnap.id;
          const isOnline = (Date.now() - (d.lastHeartbeat || 0)) < 60000;
          count++;

          const item = document.createElement("div");
          item.style.background = "#020617";
          item.style.border = "1px solid #1e293b";
          item.style.borderRadius = "8px";
          item.style.padding = "10px 12px";
          item.style.display = "flex";
          item.style.justifyContent = "space-between";
          item.style.alignItems = "center";
          item.style.gap = "8px";

          item.innerHTML = `
            <div>
              <div style="font-weight: 700; color: #f8fafc; font-size: 13px; display:flex; align-items:center; gap:6px;">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${isOnline ? '#10b981' : '#f59e0b'};"></span>
                ${hostId}
              </div>
              <div style="font-size: 11px; color: #94a3b8; margin-top: 2px;">
                ${isOnline ? '🟢 Online (Live Sharing Ready)' : '🟡 Standby'}
              </div>
            </div>
            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="window.selectAndConnectHost('${hostId}', '${d.password || 'HostAdmin@2026'}')">
              কানেক্ট করুন ➔
            </button>
          `;
          list.appendChild(item);
        });

        if (count > 0) {
          box.style.display = "block";
        }
      }, (err) => {
        console.warn("Auto-discovery listener notice:", err);
      });
    } catch (_) {}

    window.selectAndConnectHost = function(user, pwd) {
      const uEl = document.getElementById("username-input");
      const pEl = document.getElementById("password-input");
      if (uEl) uEl.value = user;
      if (pEl && pwd) pEl.value = pwd;
      connectWithCloud();
    };

    // Auto-check URL parameters or saved credentials
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const urlUser = urlParams.get("user") || urlParams.get("username") || localStorage.getItem("last_connected_user");
      const urlPwd = urlParams.get("pwd") || urlParams.get("password") || localStorage.getItem("last_connected_pwd") || "HostAdmin@2026";
      if (urlUser) {
        const uInput = document.getElementById("username-input");
        if (uInput) uInput.value = urlUser;
      }
      if (urlPwd) {
        const pInput = document.getElementById("password-input");
        if (pInput) pInput.value = urlPwd;
      }
      if (urlParams.get("auto") === "true") {
        setTimeout(() => connectWithCloud(), 300);
      }
    } catch (_) {}
  </script>
