<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Dashboard</title>
</head>
<body>

<h2 id="greeting">Hi</h2>
<button id="logoutBtn">Logout</button>

<p>Total Points: <span id="totalPoints">0</span></p>

<h3>Tasks</h3>
<ul id="tasks">
  <li data-task-id="task1">
    <b>Task 1</b> | Reward: 10 pts<br>
    <span class="timer" style="color:green"></span><br>
    <button class="joinBtn">Join</button>
    <button class="startBtn" disabled>Start</button>
  </li>
  <li data-task-id="task2">
    <b>Task 2</b> | Reward: 20 pts<br>
    <span class="timer" style="color:green"></span><br>
    <button class="joinBtn">Join</button>
    <button class="startBtn" disabled>Start</button>
  </li>
</ul>

<h3>Leaderboard</h3>
<table border="1">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Name</th>
      <th>Points</th>
    </tr>
  </thead>
  <tbody id="leaderboard"></tbody>
</table>

<h3>Request Withdraw</h3>
<input type="number" id="withdrawAmount" placeholder="Points to withdraw">
<button id="withdrawBtn">Submit Withdraw</button>

<h3>My Withdraw Requests</h3>
<ul id="myWithdraws"></ul>

<script type="module" src="js/client-dashboard.js"></script>
</body>
</html>
