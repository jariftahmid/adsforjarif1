<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
</head>
<body>

<h2>Admin Panel</h2>
<button id="logoutBtn">Logout</button>

<h3>Users</h3>
<input type="text" id="searchEmail" placeholder="Search by email">
<button id="searchBtn">Search</button>
<table border="1">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Points</th>
      <th>Toggle Role</th>
    </tr>
  </thead>
  <tbody id="usersBody"></tbody>
</table>

<h3>Task Requests (Start Clicks)</h3>
<table border="1">
  <thead>
    <tr>
      <th>User</th>
      <th>Task ID</th>
      <th>Points</th>
      <th>Time</th>
    </tr>
  </thead>
  <tbody id="taskRequestsBody"></tbody>
</table>

<h3>Withdraw Requests</h3>
<table border="1">
  <thead>
    <tr>
      <th>User</th>
      <th>Amount</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="withdrawBody"></tbody>
</table>

<h3>Export Data</h3>
<button id="exportUsersBtn">Export Users CSV</button>
<button id="exportRequestsBtn">Export Task Requests CSV</button>

<h3>Statistics</h3>
<p>Total Users: <span id="totalUsers">0</span></p>
<p>Total Task Starts: <span id="totalStarts">0</span></p>
<p>Total Points Distributed: <span id="totalPoints">0</span></p>

<h3>Statistics Charts</h3>
<label for="dateFilter">Date Filter: </label>
<select id="dateFilter">
  <option value="week">This Week</option>
  <option value="month">This Month</option>
</select>

<canvas id="dailyStartsChart" width="600" height="300"></canvas>
<canvas id="topEarnersChart" width="600" height="300"></canvas>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/admin-dashboard-charts.js"></script>

<script type="module" src="js/admin-analytics.js"></script>
</body>
</html>
